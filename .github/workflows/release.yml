name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # A release says what its tag says, in its own Info.plist. Built as 1.0.0 whatever the
      # tag, a fresh install asked GitHub for the latest release on its first launch, heard its
      # own version, and offered itself as the update. A tag that is not a semantic version
      # stops here, before the build, rather than shipping an app that cannot compare itself
      # with its own releases; build.sh holds VERSION to the same rule. Run by hand from a
      # branch there is no tag, and the build keeps Resources/Info.plist's version: that is an
      # artifact to try, and the release step below only publishes a tag.
      - name: Version from the tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$VERSION" =~ $semver ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a semantic version: expected vMAJOR.MINOR.PATCH, optionally with a pre-release such as v1.2.0-beta.1"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # CFBundleVersion: the run number only ever goes up, and a shallow checkout has one
          # commit to count.
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Building $VERSION ($GITHUB_RUN_NUMBER)"
      - name: Build and package
        run: |
          set -o pipefail
          Scripts/build.sh
          Scripts/make-dmg.sh build/MacNotchIsland.dmg
          cd build && zip -r -y MacNotchIsland.zip MacNotchIsland.app
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacNotchIsland-release
          path: |
            build/MacNotchIsland.dmg
            build/MacNotchIsland.zip
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/MacNotchIsland.dmg
            build/MacNotchIsland.zip
          generate_release_notes: true
