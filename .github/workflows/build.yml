name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "SDK $(xcrun --show-sdk-version)"
          echo "Installed Xcodes:"; ls /Applications | grep -i xcode || true
          echo "Platform macro plugins:"
          ls "$(xcode-select -p)/Platforms/MacOSX.platform/Developer/usr/lib/swift/host/plugins" 2>/dev/null || true
          echo "SwiftUI wrappers implemented as macros on this SDK:"
          grep -oh 'macro [A-Za-z]*([^)]*) = #externalMacro(module: "SwiftUIMacros"[^)]*)' \
            "$(xcrun --show-sdk-path)/System/Library/Frameworks/SwiftUI.framework/Modules/SwiftUI.swiftmodule/"*.swiftinterface \
            | sort -u || true
      - name: Build (release)
        run: |
          set -o pipefail
          swift build -c release 2>&1 | grep -v "^\[" | tail -n 300
      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | grep -v "^\[" | tee test.log | tail -n 300
      - name: Failures
        if: failure()
        run: |
          [ -f test.log ] || { echo "The build failed before the tests ran; see the build step."; exit 0; }
          echo "Failing assertions and errors:"
          grep -nE "error:|: failed|failed \(" test.log | grep -v "passed" | head -n 60 || true
      - name: Bundle
        run: |
          Scripts/build.sh
          # Zip with ditto so the executable bit and code signature survive the artifact
          # upload, which otherwise flattens permissions.
          ditto -c -k --keepParent build/MacNotchIsland.app build/MacNotchIsland.app.zip
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: MacNotchIsland
          path: build/MacNotchIsland.app.zip
          if-no-files-found: error
